name: lossyad
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip

  # Core scientific
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.11
  - scikit-learn>=1.3
  - matplotlib>=3.7

  # Deep learning (GPU)
  - pytorch>=2.0
  - pytorch-cuda=12.1   # adjust to match your CUDA version

  # Build tools (needed for SZ3/SERF native builds)
  - cmake>=3.20
  - make
  - gcc_linux-64        # Linux; macOS uses Xcode clang automatically

  - pip:
    - PyWavelets>=1.4
    - zstandard>=0.21
    - zfpy>=1.0.0
    - seaborn>=0.13
    - TSB-AD
    # MixPiece (TerseTS) — install separately after conda env is activated:
    # pip install git+https://github.com/cmcuza/TerseTS.git
